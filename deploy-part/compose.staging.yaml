name: findme-staging

# Staging topology.
#
# Unlike compose.local.yaml this file runs no PostgreSQL or Redis container:
# staging uses managed Neon (PostgreSQL + PostGIS) and managed Redis, as required
# by ARCHITECTURE-ESSENTIALS.md. Supply their connection URLs through the
# environment file documented in docs/DEPLOYMENT.md.
#
# Required values use ${NAME:?...} so `docker compose config` fails loudly
# instead of starting a stack with an empty secret or a missing origin.
services:
  frontend:
    build:
      context: ..
      dockerfile: deploy-part/docker/frontend.Dockerfile
      args:
        # Baked into the CSP and environment validation at build time. It cannot
        # be changed at runtime, so a staging build must declare staging here.
        APP_ENV: staging
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is the public API origin and is required for a staging frontend build.}
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:?NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY is required in staging. Restrict it to the staging origin.}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:?NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID is required in staging. Use a map ID from the same Google Cloud project.}
        CDN_BASE_URL: ${CDN_BASE_URL:?CDN_BASE_URL is required at frontend build time in staging and production.}
    ports:
      # Bound to loopback by default. Terminate TLS in a host reverse proxy that
      # forwards to these ports; see docs/DEPLOYMENT.md.
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      # Server-rendered rental detail pages call the API from inside the network.
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:?API_INTERNAL_BASE_URL must point at an API address reachable from the frontend container.}
      # Public website origin used for canonical and Open Graph rental URLs.
      SITE_URL: ${SITE_URL:?SITE_URL must be the public HTTPS origin of the staging site.}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy-part/docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: staging
      PORT: "3001"
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be the public HTTPS origin of the staging frontend.}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required. Use the Neon pooled connection string.}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?DATABASE_URL_UNPOOLED is required for migrations. Use the Neon direct connection string.}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required in staging for caching and rate limits.}
      # Empty means direct connections. Set only the actual reverse proxy IPs/CIDRs.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Must be at least 32 characters, different from each other, and must not
      # contain the local placeholder text; staging validation rejects those.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be a staging-only secret of at least 32 characters.}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be a staging-only secret of at least 32 characters, different from JWT_ACCESS_SECRET.}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional. At least 32 characters; leaves GET /api/v1/health/metrics
      # absent when empty.
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:?GOOGLE_MAPS_SERVER_KEY is required in staging. Keep it server-side and egress-restricted.}
      # Optional Google sign-in. Set both or leave both empty.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      # Optional Telegram. Inquiry alerts need the token and chat id together;
      # the support bot stays off until TELEGRAM_SUPPORT_ADMIN_IDS is set.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INQUIRIES_CHAT_ID: ${TELEGRAM_INQUIRIES_CHAT_ID:-}
      TELEGRAM_SUPPORT_ADMIN_IDS: ${TELEGRAM_SUPPORT_ADMIN_IDS:-}
      # Telegram serves either the webhook or polling for one bot, never both.
      TELEGRAM_SUPPORT_POLLING: "false"
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Object storage is mandatory in staging: S3_* and CDN_BASE_URL must all
      # be set together or startup fails.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:?S3_REGION is required in staging.}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required in staging.}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required in staging.}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required in staging.}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      CDN_BASE_URL: ${CDN_BASE_URL:?CDN_BASE_URL is required in staging and must be the public HTTPS CDN origin.}
    ports:
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Applies committed migrations to the managed staging database before the API
  # starts, so the deployed schema always matches the deployed code.
  database-migrate:
    build:
      context: ..
      dockerfile: deploy-part/docker/database.Dockerfile
    environment:
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?DATABASE_URL_UNPOOLED is required for migrations. Use the Neon direct connection string.}
    restart: "no"
