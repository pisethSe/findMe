name: findme-local

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy-part/docker/frontend.Dockerfile
      args:
        APP_ENV: local
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        CDN_BASE_URL: ${CDN_BASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy-part/docker/backend.Dockerfile
    environment:
      APP_ENV: local
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://findme:findme_local@postgres:5432/findme
      DATABASE_URL_UNPOOLED: postgresql://findme:findme_local@postgres:5432/findme
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-access-secret-change-before-deploying-1234
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_SECRET: local-refresh-secret-change-before-deploying-5678
      REFRESH_TOKEN_TTL_DAYS: 30
      PASSWORD_RESET_TTL_MINUTES: 30
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  database-migrate:
    build:
      context: ..
      dockerfile: deploy-part/docker/database.Dockerfile
    environment:
      DATABASE_URL_UNPOOLED: postgresql://findme:findme_local@postgres:5432/findme
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgis/postgis:17-3.5-alpine
    # The official Alpine image is currently AMD64-only. Pinning the platform
    # keeps the same reviewed PostGIS image usable through Docker Desktop's
    # emulation on Apple Silicon development machines.
    platform: linux/amd64
    environment:
      POSTGRES_DB: findme
      POSTGRES_USER: findme
      POSTGRES_PASSWORD: findme_local
    ports:
      - "5432:5432"
    volumes:
      - findme-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findme -d findme"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  findme-postgres:
