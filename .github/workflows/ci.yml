name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: findme_ci
          POSTGRES_USER: findme
          POSTGRES_PASSWORD: findme_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findme -d findme_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://findme:findme_ci@127.0.0.1:5432/findme_ci
      DATABASE_URL_UNPOOLED: postgresql://findme:findme_ci@127.0.0.1:5432/findme_ci
      TEST_DATABASE_URL: postgresql://findme:findme_ci@127.0.0.1:5432/findme_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: frontend-part/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend-part/src/**/*.ts', 'frontend-part/src/**/*.tsx', 'frontend-part/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint workspace
        run: pnpm run lint

      - name: Validate Prisma schema and migrations
        run: pnpm run db:validate

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Apply migrations to disposable PostGIS database
        run: pnpm run db:migrate

      - name: Verify reference seed is idempotent
        run: |
          pnpm run db:seed
          pnpm run db:seed

      - name: Run unit and database integration tests
        run: pnpm run test

      - name: Build production applications
        env:
          APP_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.example.test/api/v1
          NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ci_browser_key_12345678901234567890
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ci_map_id_123456
        run: pnpm run build

  containers:
    name: Build and smoke-test containers
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ci_browser_key_12345678901234567890
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ci_map_id_123456
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose -f deploy-part/compose.local.yaml config --quiet

      - name: Build and start local stack
        run: >-
          docker compose -f deploy-part/compose.local.yaml
          up --build --detach --wait --wait-timeout 120

      - name: Probe frontend and backend
        run: |
          curl --silent --show-error --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/ >/dev/null
          curl --silent --show-error --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/api/health >/dev/null
          curl --silent --show-error --fail --retry 10 --retry-delay 2 http://127.0.0.1:3001/api/v1/health/ready >/dev/null

      - name: Print container logs after failure
        if: failure()
        run: docker compose -f deploy-part/compose.local.yaml logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose -f deploy-part/compose.local.yaml down --volumes
